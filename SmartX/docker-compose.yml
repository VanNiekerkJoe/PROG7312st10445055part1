services:
  smartx-api:
    build:
      context: .
      dockerfile: SmartX.Api/Dockerfile
    ports:
      - "8080:8080"

  smartx-client:
    build:
      context: .
      dockerfile: SmartX.Client/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - smartx-api

  smartx-simulator:
    build:
      context: .
      dockerfile: SmartX.DeviceSimulator/Dockerfile
    environment:
      - SMARTX_API_URL=http://smartx-api:8080
    depends_on:
      - smartx-api
